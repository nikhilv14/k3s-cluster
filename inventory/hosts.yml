# Ansible Inventory
# Defines the hosts and groups for the K3s cluster deployment.

all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/k3s_nodes
    ansible_python_interpreter: /usr/bin/python3

k3s_cluster:
  children:
    k3s_servers:
      hosts:
        n100:
          ansible_host: 192.168.12.51
    k3s_agents:
      hosts:
        k3s-node2:
          ansible_host: 192.168.12.52
    wsl2-agents:
      hosts:
        wsl2-debian:
          ansible_host: 192.168.12.133
          ansible_connection: local

storage:
  hosts:
    truenas:
      ansible_host: 192.168.12.50

localhost_group:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    # Kubeconfig will be managed on the local machine where Ansible is run
    ansible_python_interpreter: "{{ ansible_playbook_python }}"