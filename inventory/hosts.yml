# Ansible Inventory
# Defines the hosts and groups for the K3s cluster deployment.
#
# Cluster topology (as of 2026-10-07):
#   - 3 x control-plane servers (embedded etcd, k3s v1.36.5+k3s1)
#   - API access via kube-vip ARP VIP 192.168.12.10 (manifest: networking/kube-vip.yaml)
#   - Ingress via ingress-nginx + MetalLB VIP 192.168.12.61
#   - WSL2 agent and T3600 agent have been decommissioned.

all:
  vars:
    ansible_user: nikhil
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3

k3s_cluster:
  children:
    k3s_servers:
      hosts:
        n100:               # k3s-node1 - oldest etcd member, NAS-mounted snapshots
          ansible_host: 192.168.12.51
        k3s-server-nuc:     # Proxmox VM
          ansible_host: 192.168.12.110
        k3s-server-hp-g9:   # Proxmox VM
          ansible_host: 192.168.12.132

storage:
  hosts:
    truenas:
      ansible_host: 192.168.12.50

localhost_group:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    # Kubeconfig will be managed on the local machine where Ansible is run
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
