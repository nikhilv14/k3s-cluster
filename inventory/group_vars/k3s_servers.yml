# Group variables for K3s servers
# These settings apply to all nodes in the 'k3s_servers' group.

# K3s Core Configuration
k3s_version: "v1.28.4+k3s2"
# Cluster join token lives in an untracked local file (see .gitignore):
#   k3s_token.secret  ->  single line: the raw K3s join token
# Never commit the real token.
k3s_token: "{{ lookup('ansible.builtin.file', playbook_dir + '/k3s_token.secret') | trim }}"
k3s_token_file: "/var/lib/rancher/k3s/server/node-token"
k3s_config_file: "/etc/rancher/k3s/k3s.yaml"

# K3s server command-line arguments
k3s_server_args: >-
  --cluster-init
  --cluster-cidr=10.42.0.0/16
  --service-cidr=10.43.0.0/16
  --cluster-domain=cluster.local
  --node-ip={{ ansible_host }}
  --advertise-address={{ ansible_host }}
  --flannel-backend=wireguard-native
  --kubelet-arg=max-pods=250
  --disable=traefik,servicelb
  --write-kubeconfig-mode=644
  --log /var/log/k3s-server.log

# System packages required for K3s server and related tools
system_packages:
  - curl
  - wget
  - jq
  - open-iscsi
  - git
  - python3-pip
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release

# Helm repositories for Kubernetes packages
helm_repos:
  - name: longhorn
    repo_url: "https://charts.longhorn.io"
  - name: jetstack
    repo_url: "https://charts.jetstack.io"
  - name: vmware-tanzu
    repo_url: "https://vmware-tanzu.github.io/helm-charts"
  - name: argocd
    repo_url: "https://argoproj.github.io/argo-helm"

# Longhorn settings for the single-node cluster
longhorn_replicas: 1
longhorn_storage_class_default: true
longhorn_cpu_limit: "500m"
longhorn_mem_limit: "512Mi"
