# Group variables for K3s servers
# These settings apply to all nodes in the 'k3s_servers' group.

# K3s Core Configuration
k3s_version: "v1.36.5+k3s1"
# Cluster join token lives in an untracked local file (see .gitignore):
#   k3s_token.secret  ->  single line: the raw K3s join token
# Never commit the real token.
k3s_token: "{{ lookup('ansible.builtin.file', playbook_dir + '/k3s_token.secret') | trim }}"
k3s_token_file: "/var/lib/rancher/k3s/server/node-token"
k3s_config_file: "/etc/rancher/k3s/k3s.yaml"

# API VIP (kube-vip, ARP mode - see networking/kube-vip.yaml).
# Must be listed in tls-san on every server so API certs validate over the VIP.
kube_vip_address: "192.168.12.10"

# K3s server command-line arguments
# NOTE: CNI/flannel uses the default vxlan backend on UDP 8472 (all nodes standard).
# The old WSL2 workaround (custom UDP port 48472 via /etc/rancher/k3s/flannel-net-conf.json)
# is retired - all nodes now listen on 8472. Do NOT re-add the custom flannel-net-conf.json;
# node1's k3s requires that file if it exists, and a mismatched port breaks the overlay.
k3s_server_args: >-
  --cluster-init
  --cluster-cidr=10.42.0.0/16
  --service-cidr=10.43.0.0/16
  --cluster-domain=cluster.local
  --node-ip={{ ansible_host }}
  --advertise-address={{ ansible_host }}
  --kubelet-arg=max-pods=250
  --write-kubeconfig-mode=644

# Contents written to /etc/rancher/k3s/config.yaml on every server (see role).
# Matches the live cluster: traefik and klipper servicelb are disabled
# (ingress-nginx + MetalLB are used instead), and the API VIP is in tls-san.
k3s_config_extra:
  disable:
    - traefik
    - servicelb
  tls-san:
    - "{{ kube_vip_address }}"

# Per-host extra config (etcd snapshots to NAS) lives in host_vars/n100.yml
# because /mnt/nas-k3s-snapshots is only mounted on n100.

# Kubeconfig served locally points at the node IP; rewrite it to the VIP.
k3s_kubeconfig_server: "https://{{ kube_vip_address }}:6443"

# System packages required for K3s server and related tools
system_packages:
  - curl
  - wget
  - jq
  - open-iscsi
  - nfs-common
  - git
  - python3-pip
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release

# Longhorn cluster default replicas (cluster-wide Setting 'default-replica-count').
# Per-volume replicas are controlled by storage classes (ssd-cache/nas-rwx use 2).
longhorn_default_replicas: 1
# Replicas for the default 'longhorn' StorageClass (live SC param numberOfReplicas=2).
longhorn_sc_replica_count: 2
longhorn_storage_class_default: true
longhorn_cpu_limit: "500m"
longhorn_mem_limit: "512Mi"
# Pin the chart so re-running never silently upgrades the release.
longhorn_chart_version: "1.10.1"

# Longhorn node integration: every server must be a schedulable Longhorn node
# with the 'ssd' node/disk tags (required by the ssd-cache StorageClass).
longhorn_node_tags: ["ssd"]
longhorn_disk_tags: ["ssd"]

# Kubernetes node name defaults to the hostname (matches inventory name).
k8s_node_name: "{{ ansible_hostname }}"
