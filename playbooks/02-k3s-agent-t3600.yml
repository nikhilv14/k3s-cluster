# Agent Playbook for T3600 k3s Agent Deployment
# This playbook sets up a K3s agent on T3600 Ubuntu/Debian VM.

- name: "Fetch K3s Token from Server"
  hosts: k3s_servers
  gather_facts: false
  become: true
  tasks:
    - name: "Fetch K3s node token"
      ansible.builtin.slurp:
        src: "/var/lib/rancher/k3s/server/node-token"
      register: k3s_token_slurp

    - name: "Write K3s token to file on localhost"
      ansible.builtin.copy:
        content: "{{ k3s_token_slurp['content'] | b64decode | trim }}"
        dest: "/tmp/k3s_token.txt"
      delegate_to: localhost

- name: "Phase 1 Day 2 PT3: Setup K3s Agent on T3600"
  hosts: k3s_agents
  gather_facts: true
  become: true

  pre_tasks:
    - name: "Display deployment information"
      ansible.builtin.debug:
        msg:
          - "Starting K3s agent deployment on {{ inventory_hostname }} ({{ ansible_host }})..."
          - "Target: K3s T3600 agent with intermittent labeling and role=t3600"

  tasks:
    - name: "Add Docker GPG key"
      ansible.builtin.apt_key:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        state: present

    - name: "Add Docker repository"
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present

    - name: "T3600 | Update apt package cache"
      ansible.builtin.apt:
        update_cache: true

    - name: "T3600 | Install prerequisite system packages"
      ansible.builtin.package:
        name:
          - curl
          - iptables
          - containerd.io
        state: present

    - name: "T3600 | Read K3s token from file"
      ansible.builtin.slurp:
        src: "/tmp/k3s_token.txt"
      delegate_to: localhost
      register: k3s_token_file

    - name: "T3600 | Set K3s URL and token facts"
      ansible.builtin.set_fact:
        k3s_url: "https://192.168.12.51:6443"
        k3s_token: "{{ k3s_token_file['content'] | b64decode | trim }}"

    - name: "T3600 | Clean up token file"
      ansible.builtin.file:
        path: "/tmp/k3s_token.txt"
        state: absent
      delegate_to: localhost

    - name: "T3600 | Disable swap for Kubernetes compatibility"
      ansible.builtin.command: swapoff -a
      when: "ansible_swaptotal_mb > 0"
      changed_when: false

    - name: "T3600 | Disable swap permanently"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^(/\\S+\\s+swap\\s+)|^([^#]\\s*/\\s+swap\\s+)"
        state: absent
      when: "ansible_swaptotal_mb > 0"

    - name: "T3600 | Set required kernel parameters for K3s"
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - name: vm.overcommit_memory
          value: "1"
        - name: kernel.panic
          value: "10"
        - name: kernel.panic_on_oops
          value: "1"

    - name: "T3600 | Download K3s installer script"
      ansible.builtin.get_url:
        url: "https://get.k3s.io"
        dest: "/tmp/k3s_install.sh"
        mode: '0755'
      retries: 3
      delay: 10

    - name: "T3600 | Install K3s agent"
      ansible.builtin.command:
        cmd: /tmp/k3s_install.sh agent --node-name "{{ inventory_hostname }}" --node-ip="{{ ansible_host }}" --protect-kernel-defaults --node-label intermittent=true --node-label role=t3600 --node-taint intermittent=true:NoSchedule
      environment:
        K3S_URL: "{{ k3s_url }}"
        K3S_TOKEN: "{{ k3s_token }}"
        INSTALL_K3S_VERSION: "v1.28.4+k3s2"
      register: k3s_agent_install
      changed_when: "'k3s is already installed' not in k3s_agent_install.stdout"

    - name: "T3600 | Enable and start k3s-agent service"
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started

- name: "Final Verification"
  hosts: k3s_agents
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: "/home/nikhil/k3sSetup/k3s.yaml"
    node_name: "{{ inventory_hostname }}"
  tasks:
    - name: "FINAL | Verify network connectivity to K3s server"
      ansible.builtin.command: ping -c 3 192.168.12.51
      register: ping_result
      changed_when: false
      failed_when: ping_result.rc != 0
      tags: verification

    - name: "FINAL | Verify K3s agent node is Ready"
      ansible.builtin.shell: kubectl --kubeconfig={{ kubeconfig_path }} get nodes {{ node_name }} -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}'
      delegate_to: localhost
      register: node_ready
      changed_when: false
      failed_when: "node_ready.stdout | trim != 'True'"
      tags: verification

    - name: "FINAL | Verify node labels and taints"
      ansible.builtin.shell: kubectl --kubeconfig={{ kubeconfig_path }} get nodes {{ node_name }} -o jsonpath='{.metadata.labels.intermittent},{.metadata.labels.role},{.spec.taints[?(@.key==\"intermittent\")].value}'
      delegate_to: localhost
      register: labels_taints
      changed_when: false
      failed_when: "'true,t3600,true' not in labels_taints.stdout | trim"
      tags: verification

    - name: "FINAL | Display Verification Results"
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "✅ Phase 1 Day 2 PT3 COMPLETE"
          - "K3s agent on T3600 is ready."
          - "========================================================================="
          - ""
          - "=== Node Status ==="
          - "Node {{ node_name }} is Ready: {{ node_ready.stdout | trim }}"
          - ""
          - "=== Labels/Taints ==="
          - "Intermittent label: true, Role: t3600, Taint: intermittent=true:NoSchedule"
          - ""

    - name: "Final success message"
      ansible.builtin.debug:
        msg:
          - "✅ Playbook complete. T3600 agent added to cluster."