# Agent Playbook for WSL2 k3s Agent Deployment
# This playbook sets up a K3s agent on WSL2 Debian Bookworm.

- name: "Fetch K3s Token from Server"
  hosts: k3s_servers
  gather_facts: false
  become: true
  tasks:
    - name: "Fetch K3s node token"
      ansible.builtin.slurp:
        src: "/var/lib/rancher/k3s/server/node-token"
      register: k3s_token_slurp

    - name: "Write K3s token to file on localhost"
      ansible.builtin.copy:
        content: "{{ k3s_token_slurp['content'] | b64decode | trim }}"
        dest: "/tmp/k3s_token.txt"
      delegate_to: localhost

- name: "Phase 1 Day 2 PT2: Setup K3s Agent on WSL2"
  hosts: wsl2-agents
  gather_facts: true
  become: true

  pre_tasks:
    - name: "Display deployment information"
      ansible.builtin.debug:
        msg:
          - "Starting K3s agent deployment on {{ inventory_hostname }} ({{ ansible_host }})..."
          - "Target: K3s agent with intermittent labeling"

  tasks:
    - name: "WSL2 | 1. Enable systemd in /etc/wsl.conf"
      ansible.builtin.lineinfile:
        path: /etc/wsl.conf
        line: |
          [boot]
          systemd=true
        create: true
        mode: '0644'

    - name: "WSL2 | 2. Add Docker GPG key"
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: "WSL2 | 3. Add Docker repository"
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
        state: present

    - name: "WSL2 | 4. Update apt package cache"
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: "WSL2 | 5. Install prerequisite system packages"
      ansible.builtin.package:
        name:
          - curl
          - iptables
          - containerd.io
        state: present

    - name: "WSL2 | 6. Read K3s token from file"
      ansible.builtin.slurp:
        src: "/tmp/k3s_token.txt"
      register: k3s_token_file

    - name: "WSL2 | 7. Set K3s URL and token facts"
      ansible.builtin.set_fact:
        k3s_url: "https://192.168.12.51:6443"
        k3s_token: "{{ k3s_token_file['content'] | b64decode | trim }}"

    - name: "WSL2 | 8. Clean up token file"
      ansible.builtin.file:
        path: "/tmp/k3s_token.txt"
        state: absent

    - name: "WSL2 | 9. Disable swap for Kubernetes compatibility"
      ansible.builtin.command: swapoff -a
      when: "ansible_swaptotal_mb > 0"
      changed_when: false

    - name: "WSL2 | 9b. Disable swap permanently"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^(/\\S+\\s+swap\\s+)|^([^#]\\s*/\\s+swap\\s+)"
        state: absent
      when: "ansible_swaptotal_mb > 0"

    - name: "WSL2 | 13. Create K3s configuration directory"
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "WSL2 | 14. Download K3s installer script"
      ansible.builtin.get_url:
        url: "https://get.k3s.io"
        dest: "/tmp/k3s_install.sh"
        mode: '0755'
      retries: 3
      delay: 10

    - name: "WSL2 | 15. Install K3s agent"
      ansible.builtin.command:
        cmd: /tmp/k3s_install.sh agent --node-name "{{ inventory_hostname }}-worker" --node-ip="{{ ansible_default_ipv4.address }}" --protect-kernel-defaults --node-label intermittent=true --node-taint intermittent=true:NoSchedule
      environment:
        K3S_URL: "{{ k3s_url }}"
        K3S_TOKEN: "{{ k3s_token }}"
        INSTALL_K3S_VERSION: "v1.28.4+k3s2"
      register: k3s_agent_install
      changed_when: "'k3s is already installed' not in k3s_agent_install.stdout"

    - name: "WSL2 | 16. Enable and start k3s-agent service"
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started

- name: "Final Verification"
  hosts: wsl2-agents
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: "/home/nikhil/k3sSetup/k3s.yaml"
    node_name: "{{ inventory_hostname }}-worker"
  tasks:
    - name: "FINAL | Verify network connectivity to K3s server"
      ansible.builtin.command: ping -c 3 192.168.12.51
      register: ping_result
      changed_when: false
      failed_when: ping_result.rc != 0
      tags: verification

    - name: "FINAL | Verify K3s agent node is Ready"
      ansible.builtin.shell: kubectl --kubeconfig={{ kubeconfig_path }} get nodes {{ node_name }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      changed_when: false
      failed_when: "node_ready.stdout | trim != 'True'"
      tags: verification

    - name: "FINAL | Verify node labels and taints"
      ansible.builtin.shell: kubectl --kubeconfig={{ kubeconfig_path }} get nodes {{ node_name }} -o jsonpath='{.metadata.labels.intermittent},{.spec.taints[?(@.key=="intermittent")].value}'
      register: labels_taints
      changed_when: false
      failed_when: "'true,true' not in labels_taints.stdout | trim"
      tags: verification

    - name: "FINAL | Display Verification Results"
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "✅ Phase 1 Day 2 PT2 COMPLETE"
          - "K3s agent on WSL2 is ready."
          - "========================================================================="
          - ""
          - "=== Node Status ==="
          - "Node {{ node_name }} is Ready: {{ node_ready.stdout | trim }}"
          - ""
          - "=== Labels/Taints ==="
          - "Intermittent label: true, Taint: true"
          - ""

    - name: "Final success message"
      ansible.builtin.debug:
        msg:
          - "✅ Playbook complete. WSL2 agent added to cluster."
