# kube-vip - HA control-plane VIP (ARP mode with leader election).
# The VIP 192.168.12.10 fronts the kube-apiserver on the 3 control-plane nodes.
# kubectl / node-join URLs should use https://192.168.12.10:6443.
#
# Prereqs:
#   - 192.168.12.10 must be OUTSIDE the MetalLB IPAddressPool (lan-pool
#     covers 192.168.12.61-192.168.12.70).
#   - Every k3s server must list the VIP in tls-san (see group_vars
#     k3s_config_extra) so API certs validate over the VIP.
#   - Requires k3s auto-deploy: place this file in
#     /var/lib/rancher/k3s/server/manifests/ on each server (k3s applies it
#     automatically), or apply manually with kubectl.
#
# NOTE on env vars (kube-vip v0.9.x):
#   - cp_enable (legacy alias) is still required in addition to
#     vip_controlplane - omitting it yields "no features are enabled".
#   - The VIP must be a plain IP plus vip_subnet=32; embedding "/32" in
#     vip_address makes v0.9.1 attempt a DNS lookup and fail.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip
rules:
  - apiGroups: [""]
    resources: ["services", "services/status", "nodes", "endpoints"]
    verbs: ["list", "get", "watch", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    app: kube-vip
spec:
  selector:
    matchLabels:
      app: kube-vip
  template:
    metadata:
      labels:
        app: kube-vip
    spec:
      hostNetwork: true
      serviceAccountName: kube-vip
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v0.9.1
          imagePullPolicy: IfNotPresent
          args: ["manager"]
          env:
            - name: cp_enable
              value: "true"
            - name: vip_controlplane
              value: "true"
            - name: vip_arp
              value: "true"
            - name: vip_leaderelection
              value: "true"
            - name: vip_address
              value: "192.168.12.10"
            - name: vip_subnet
              value: "32"
            - name: vip_leaseduration
              value: "5"
            - name: vip_renewdeadline
              value: "3"
            - name: vip_retryperiod
              value: "1"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
