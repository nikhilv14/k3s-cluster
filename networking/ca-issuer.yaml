apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: ca-key-pair
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ca-root
  namespace: cert-manager
spec:
  secretName: ca-key-pair
  isCA: true                      # REQUIRED - without it cert-manager issues a
                                  # leaf cert (CA:FALSE) and internal-ca fails
                                  # with ErrInvalidKeyPair "certificate is not a CA"
  duration: 87600h0m0s            # 10 years for the root CA
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: k3s-homelab-ca.home
  dnsNames:
  - k3s-homelab-ca.home
