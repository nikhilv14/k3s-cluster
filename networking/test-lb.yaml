apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-lb
  template:
    metadata:
      labels:
        app: test-lb
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: test-lb-svc
spec:
  type: LoadBalancer
  selector:
    app: test-lb
  ports:
  - port: 80
    targetPort: 80