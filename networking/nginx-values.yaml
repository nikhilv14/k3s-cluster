controller:
  kind: DaemonSet
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443
  tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: Exists
    effect: NoSchedule
  - key: "lxc-no-iscsi"
    operator: Exists
    effect: NoSchedule
  ingressClassResource:
    default: true
    controllerValue: k8s.io/ingress-nginx
  resources:
    limits:
      cpu: 200m
      memory: 256Mi