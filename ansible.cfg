[defaults]
inventory = inventory/hosts.yml
roles_path = ./roles
remote_user = nikhil
private_key_file = ~/.ssh/id_ed25519
host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400
timeout = 60
pipelining = True

[ssh_connection]
pipelining = True