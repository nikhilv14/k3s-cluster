[defaults]
inventory = inventory/hosts.yml
roles_path = ./roles
remote_user = ubuntu
private_key_file = ~/.ssh/k3s_nodes
host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400
timeout = 60
pipelining = True

[ssh_connection]
pipelining = True