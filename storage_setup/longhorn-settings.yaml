# Longhorn cluster-wide settings: speed + redundancy
# - default-replica-count 1: volumes provisioned via the default 'longhorn'
#   StorageClass get 1 replica by default (matches live cluster; the longhorn
#   SC itself carries numberOfReplicas=2, and ssd-cache uses 2 via its params).
# - replica-auto-balance least-effort: spread replicas; best-effort requires
#   3+ zone/node awareness.
# - snapshot-max-count 250: ceiling for the snapshot chain per volume
#   (live volumes carry 2-3 snapshots each).
# Storage classes control dataLocality (ssd-cache: best-effort keeps the engine
# + 1 replica on the writer node; the 2nd replica adds node-failure tolerance).
# NOTE: Longhorn v1.10 Setting CRDs carry the value as a top-level "value"
# field (no spec). default-replica-count uses the v1/v2 data-engine map format.
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: default-replica-count
  namespace: longhorn-system
value: '{"v1":"1","v2":"1"}'
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-auto-balance
  namespace: longhorn-system
value: "least-effort"  # spread replicas; best-effort requires 3+ zones-nodes awareness
