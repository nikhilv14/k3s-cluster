apiVersion: v1
kind: Pod
metadata:
  name: test-nas-pod
  namespace: storage
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command:
      - sleep
      - "3600"
    volumeMounts:
    - mountPath: /data
      name: storage
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: nas-test-pvc