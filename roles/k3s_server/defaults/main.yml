# defaults file for k3s_server
# Provides default values for the K3s server role. These can be overridden
# by group_vars or host_vars.

# K3s Core Defaults
k3s_version: "v1.28.4+k3s2"
k3s_token: "" # Must be set in group_vars/k3s_servers.yml for security
k3s_token_file: "/var/lib/rancher/k3s/server/node-token"
k3s_config_file: "/etc/rancher/k3s/k3s.yaml"

# K3s server arguments (intentionally empty, defined in group_vars)
k3s_server_args: ""

# System packages (intentionally empty, defined in group_vars)
system_packages: []

# Helm repositories (intentionally empty, defined in group_vars)
helm_repos: []
