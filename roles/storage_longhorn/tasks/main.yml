# tasks file for storage_longhorn
# This role installs and configures Longhorn distributed block storage.

- name: "LONGHORN | 1. Add Longhorn Helm repository"
  delegate_to: localhost
  run_once: true
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: "https://charts.longhorn.io"
    state: present
  tags: longhorn

- name: "LONGHORN | 2. Create longhorn-system namespace"
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    name: longhorn-system
    api_version: v1
    kind: Namespace
    state: present
  tags: longhorn

- name: "LONGHORN | 3. Install Longhorn via Helm chart"
  delegate_to: localhost
  run_once: true
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    release_namespace: longhorn-system
    create_namespace: true
    values:
      persistence:
        defaultClassReplicaCount: "{{ longhorn_replicas }}"
      defaultSettings:
        defaultDataLocality: "best-effort"
        defaultReplicaCount: "{{ longhorn_replicas }}"
      longhornManager:
        resources:
          limits:
            cpu: "{{ longhorn_cpu_limit }}"
            memory: "{{ longhorn_mem_limit }}"
      longhornDriver:
        resources:
          limits:
            cpu: "{{ longhorn_cpu_limit }}"
            memory: "{{ longhorn_mem_limit }}"
      longhornUI:
        resources:
          limits:
            cpu: "{{ longhorn_cpu_limit }}"
            memory: "{{ longhorn_mem_limit }}"
  register: longhorn_install
  retries: 3
  delay: 15
  tags: longhorn

- name: "LONGHORN | 4. Wait for Longhorn manager to be ready"
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: longhorn-manager
    namespace: longhorn-system
  register: longhorn_ds
  until: "longhorn_ds.resources[0].status.numberReady == longhorn_ds.resources[0].status.desiredNumberScheduled"
  retries: 60
  delay: 10
  changed_when: false
  tags: longhorn

- name: "LONGHORN | 5. Set Longhorn as the default storage class if enabled"
  delegate_to: localhost
  run_once: true
  when: longhorn_storage_class_default
  block:
    - name: "LONGHORN | 5.1 Get all storage classes"
      kubernetes.core.k8s_info:
        kind: StorageClass
        api_version: storage.k8s.io/v1
      register: sc_list

    - name: "LONGHORN | 5.2 Unset other default storage classes"
      kubernetes.core.k8s:
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: "{{ item.metadata.name }}"
            annotations:
              storageclass.kubernetes.io/is-default-class: "false"
      loop: "{{ sc_list.resources }}"
      when: >
        item.metadata.annotations is defined and
        item.metadata.annotations['storageclass.kubernetes.io/is-default-class'] == 'true' and
        item.metadata.name != 'longhorn'

    - name: "LONGHORN | 5.3 Set longhorn as the default storage class"
      kubernetes.core.k8s:
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: "longhorn"
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
  tags: longhorn

- name: "LONGHORN | 6. Verify Longhorn StorageClass"
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s_info:
    kind: StorageClass
    name: longhorn
  register: longhorn_sc
  until: "longhorn_sc.resources | length > 0"
  retries: 10
  delay: 5
  changed_when: false
  tags: longhorn

- name: "LONGHORN | 6.1. Display Longhorn StorageClass status"
  delegate_to: localhost
  run_once: true
  ansible.builtin.debug:
    msg: "Longhorn StorageClass '{{ longhorn_sc.resources[0].metadata.name }}' is available. Default: {{ longhorn_sc.resources[0].metadata.annotations['storageclass.kubernetes.io/is-default-class'] | default('false') }}"
  when: longhorn_sc.resources | length > 0
  tags: longhorn